<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Editor â€” Nima Vale Portfolio</title>
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../assets/css/core.css">
</head>
<body>
  <main style="min-height: 100vh; margin: 0; padding: 0; overflow: hidden; font-family: var(--font-sans); font-size: clamp(1rem, 0.96rem + 0.2vw, 1.075rem); line-height: 1.65; color: var(--bg); background: var(--bg);">
    <!-- Top toolbar -->
    <header style="
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    ">
      <div style="
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      ">
        <!-- Back to Dashboard -->
        <a href="/admin/dashboard.html" style="
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          padding: 0.5rem 1rem;
          border: 1px solid var(--line);
          border-radius: 0;
          font-size: 0.75rem;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          color: var(--muted);
          text-decoration: none;
          transition: color 0.3s, background 0.3s;
        "hover{background: var(--ink);color: var(--bg)}
        ">
          <svg width="16" height="16" viewBox="0 0 24 24" style="color: var(--muted);" aria-hidden="true"><path d="M15 18l-5-5 5-5 5 5-5 5z"/></svg>
          Back to Dashboard
        </a>

        <!-- Current page selector -->
        <select style="
          font: inherit;
          padding: 0.5rem 1rem;
          border: 1px solid var(--line);
          border-radius: 0;
          background: var(--bg-2);
          color: var(--ink);
          min-width: 150px;
        ">
          <option value="">â€” Select Page/Section â€”</option>
          <option value="index.html">Home</option>
          <option value="portfolio/graphic-design.html">Graphic Design</option>
          <option value="portfolio/posters.html">Posters</option>
          <option value="portfolio/motion-video.html">Video Editing</option>
          <option value="portfolio/ai-visual-lab.html">AI Videos</option>
          <option value="index.html#contact">Collaboration</option>
        </select>

        <!-- Preview size buttons -->
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg-2); color: var(--ink); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem;">Desktop</button>
          <button class="btn" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg-2); color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem;">Tablet</button>
          <button class="btn" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg-2); color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem;">Mobile</button>
        </div>

        <!-- Edit Mode toggle -->
        <button class="btn--solid" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 0; background: var(--ink); color: var(--bg); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem;" id="editModeBtn">
          Edit Mode ON
        </button>

        <!-- Save / Publish -->
        <button class="btn--solid" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--accent); border-radius: 0; background: var(--accent); color: var(--bg); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem; margin-left: 1rem;" onclick="window.savePage()">Save</button>
        <button class="btn" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg-2); color: var(--ink); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem; margin-left: 0.5rem;" onclick="window.publishPage()">Publish</button>
      </div>
    </header>

    <!-- Section Navigator -->
    <aside class="section-navigator-panel" style="
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 300px;
      background: var(--bg);
      border-right: 1px solid var(--line);
      z-index: 80;
      overflow-y: auto;
      padding: 1rem;
    ">
      <div style="margin-bottom: 1rem;">
        <h4 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: var(--ink);">Sections</h4>
      </div>
      <div id="section-navigator" style="height: calc(100vh - 140px); overflow-y: auto;"></div>
    </div>

    <!-- Website iframe -->
    <iframe style="
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: var(--bg);
      overflow-y: auto;
    " name="site-preview" src="/" title="Website preview" id="site-preview"></iframe>

    <!-- Right inspector panel (hidden until element selected) -->
    <aside style="
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 320px;
      max-width: 320px;
      background: var(--bg);
      border-left: 1px solid var(--line);
      z-index: 50;
      overflow-y: auto;
      transition: transform 0.3s ease;
      transform: translateX(320px);
    " id="inspector" aria-label="Element inspector">
      <div style="
        background: var(--accent);
        color: var(--bg);
        padding: 1rem 1.5rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1rem;
      ">
        Element Inspector
      </div>
      <div style="padding: 1.5rem;">
        <div style="display: none; align-items: center; justify-content: center; height: 100px; border: 1px dashed var(--line); margin-bottom: 1rem;;">
          <svg width="40" height="40" viewBox="0 0 24 24" style="color: var(--muted);" aria-hidden="true"><path d="M10 20v-6h6v6h5v12h-5v6h-6v-6h-5v-12h5vzM17 3H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 3v6c0 1.66 2.69 3 3.5 3.5v6h2v-6H7z"/></svg>
          <span>Click an element to edit</span>
        </span>
      </div>
      <div id="inspector-content" style="display: none;">
        <!-- Inspector content will be injected here -->
      </div>
    </aside>

    <!-- Section Inspector -->
    <aside class="section-inspector-panel" style="
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 350px;
      background: var(--bg);
      border-left: 1px solid var(--line);
      z-index: 80;
      overflow-y: auto;
      padding: 1rem;
      display: none;
    ">
      <div style="margin-bottom: 1rem;">
        <h4 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: var(--ink);">Section Inspector</h4>
        <button class="btn--solid" style="font: inherit; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg-2); color: var(--ink); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1rem;" onclick="toggleSectionInspector()">Close Inspector</button>
      </div>
      <div id="section-inspector-content" style="padding: 0.5rem 0;">
        <!-- Inspector content will be injected here -->
      </div>
    </aside>

    <script>
      // ==================== VARIABLES ====================
      // State is now managed by EditorState module; these are kept in sync
      // for backward compatibility with existing logic.
      const iframe = document.getElementById('site-preview');
      const inspector = document.getElementById('inspector');
      const inspectorContent = document.getElementById('inspector-content');
      const editModeBtn = document.getElementById('editModeBtn');
      
      // Sync local vars with EditorState on init (called on DOMContentLoaded)
      const es = window.__peEditorState;
      if (es) {
        isEditMode = es.isEditMode;
        selectedElement = es.selectedElement ? document.querySelector(`[data-editor-id="${es.selectedElement}"]`) : null;
        editingElement = es.editingElement ? document.querySelector(`[data-editor-id="${es.editingElement}"]`) : null;
      }
      
      // ==================== IFRAME LOAD ====================
      iframe.addEventListener('load', () => {
        // iframe is same-origin (/), so we can access DOM directly
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        
        // Make the body editable in non-edit mode for preview
        doc.body.setAttribute('spellcheck', 'false');
      // Trigger reveal animations for data-reveal elements
      const reveals = doc.querySelectorAll('[data-reveal]');
      reveals.forEach((el, i) => {
        const delay = i * 0.1;
        setTimeout(() => {
          el.classList.add('is-in');
        }, delay * 1000);
      });
      // Sync data-editor-id map so newly loaded elements are findable
      EditorState._onIframeLoad(iframe);
      });
      
      // ==================== EDIT MODE TOGGLE ====================
      editModeBtn.addEventListener('click', () => {
        const wasEditMode = isEditMode;
        isEditMode = !isEditMode;
        editModeBtn.textContent = isEditMode ? 'Edit Mode OFF' : 'Edit Mode ON';
        
        if (isEditMode) {
          // Enter edit mode
          iframe.style.outline = '2px solid var(--accent)';
          iframe.style.outlineOffset = '4px';
          iframe.contentDocument.body.style.cursor = 'crosshair';
          iframe.contentDocument.body.style.userSelect = 'none';
          // Enable element clicking
          setupElementSelection(iframe);
          inspector.style.transform = 'translateX(0)';
          // Update EditorState
          EditorState.toggleEditMode();
        } else {
          // Exit edit mode
          iframe.style.outline = 'none';
          iframe.style.outlineOffset = '0px';
          iframe.contentDocument.body.style.cursor = 'default';
          iframe.contentDocument.body.style.userSelect = '';
          resetElementSelection(iframe);
          inspector.style.transform = 'translateX(320px)';
          // Update EditorState
          EditorState.toggleEditMode();
        }
      });
      
      // ==================== ELEMENT SELECTION ====================
      function setupElementSelection(iframe) {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        let clickTimeout = null;
        
        doc.addEventListener('click', (e) => {
          // Deselect previous element through EditorState
          EditorState.deselectElement(iframe);
          
          const target = e.target.closest('*');
          if (!target) return;
          
          // Assign a stable data-editor-id and update state
          const editorId = EditorState.selectElement(iframe, target);
          
          // Update local vars for backward compatibility with existing code
          selectedElement = EditorState.state.selectedElement;
          editingElement = EditorState.state.editingElement;
          
          // Highlight selected element via DomManager
          DomManager.highlightElement(iframe, editorId, true);
          
          // Show inspector with element-specific controls
          showInspector(selectedElement);
          
          // Prevent default navigation on click in edit mode
          e.preventDefault();
          e.stopPropagation();
        });
      }
      
      function resetElementSelection(iframe) {
        // Delegate to EditorState which handles highlighting, inspector hide,
        // and localStorage persistence
        EditorState.deselectElement(iframe);
        
        // Update local vars for backward compatibility
        selectedElement = EditorState.state.selectedElement;
        editingElement = EditorState.state.editingElement;
        
        // Highlight reset already done in Editor and inspector hide done in EditorState
        // But ensure local state sync:
        const inspectorContent = document.getElementById('inspector-content');
        if (inspectorContent) {
          inspectorContent.style.display = 'none';
          inspectorContent.innerHTML = '';
        }
        const inspector = document.getElementById('inspector');
        if (inspector) {
          inspector.style.transform = 'translateX(320px)';
        }
        
        // Reset body styles in iframe
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (doc) {
          doc.body.style.userSelect = '';
          doc.body.style.cursor = 'default';
        }
      }
      
      function showInspector(element) {
        inspector.style.transform = 'translateX(0)';
        inspectorContent.style.display = 'block';
        
        // Build inspector based on element type
        const tag = element.tagName.toLowerCase();
        const computed = iframe.contentDocument ? iframe.contentDocument.defaultView.getComputedStyle(element, null) : {};
        
        let html = '';
        
        if (tag === 'img') {
          // Image element
          const src = element.getAttribute('src') || '';
          const alt = element.getAttribute('alt') || '';
          html = `
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Image Preview</label>
              <img src="${src}" style="width: 100%; max-width: 200px; height: auto; border: 1px solid var(--line); border-radius: 0; object-fit: cover;" alt="${alt}">
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" placeholder="Image URL" value="${src}">
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Alt Text</label>
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${alt}">
            </div>
          `;
        } else if (tag === 'a') {
          // Link/button element
          const text = element.innerText || '';
          const href = element.getAttribute('href') || '';
          const target = element.getAttribute('target') || '_self';
          html = `
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Link Text</label>
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${text}">
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">URL</label>
              <input type="url" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${href}">
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Target</label>
              <select style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);">
                <option value="_self">_self</option>
                <option value="_blank">_blank</option>
              </select>
            </div>
          `;
        } else if (tag === 'span' || tag === 'div' || tag === 'p' || tag === 'h1' || tag === 'h2' || tag === 'h3' || tag === 'h4') {
          // Text element
          const text = element.innerText || '';
          const fontFamily = computed.fontFamily || 'var(--font-sans)';
          const fontSize = computed.fontSize || '1rem';
          const fontWeight = computed.fontWeight || '400';
          const color = computed.color || 'var(--ink)';
          const textAlign = computed.textAlign || 'left';
          
          html = `
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Text Content</label>
              <textarea style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink); font-family: var(--font-sans);" rows="3" placeholder="Text content...">${text}</textarea>
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Font Family</label>
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${fontFamily}" placeholder="e.g. Inter, serif">
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Font Size</label>
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${fontSize}" placeholder="e.g. 1rem">
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Font Weight</label>
              <select style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);">
                <option value="400">Normal (400)</option>
                <option value="700">Bold (700)</option>
                <option value="900">Black (900)</option>
              </select>
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Text Color</label>
              <input type="color" style="width: 100%; height: 2rem; padding: 0rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg);" value="${color}" />
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Text Alignment</label>
              <select style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </div>
          `;
        } else {
          // Container/section element
          const bgColor = computed.backgroundColor || 'transparent';
          const padding = computed.padding || '0';
          const margin = computed.margin || '0';
          
          html = `
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Background Color</label>
              <input type="color" style="width: 100%; height: 2rem; padding: 0rem; border: 1px solid var(--line); border-radius: 0; background: var(--bg);" value="${bgColor.replace('rgba(', '').replace(')', '').replace(/ /g, '').replace(/opacity[^)]*/, '')}" />
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Padding</label>
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${padding}" placeholder="e.g. 1rem 2rem">
            </div>
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Margin</label>
              <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0; margin-top: 0.5rem; background: var(--bg); color: var(--ink);" value="${margin}" placeholder="e.g. 1rem">
            </div>
          `;
        }
        
        inspectorContent.innerHTML = html;
      
      // === PHASE 3: Apply changes from inspector to iframe DOM ===
      // We use event delegation: attach handlers once after the inspector is built
      attachInspectorChangeHandlers(iframe, selectedElement);
    }
    
    // === PHASE 3: Attach change handlers to inspector inputs ===
    function attachInspectorChangeHandlers(iframe, element) {
      if (!iframe || !element) return;
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc) return;
  
      const tag = element.tagName.toLowerCase();
  
      // Helper: apply a style property to the element in the iframe
      const applyStyle = (prop, value) => {
        const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
        if (!el) return;
        el.style[prop] = value;
      };
  
      // Helper: record a modification in editor state
      const recordMod = (property, original, newValue) => {
        EditorState.recordModification({
          property,
          original,
          newValue,
          elementId: element.getAttribute('data-editor-id') || ''
        });
        EditorState.saveDraftChange({
          elementId: element.getAttribute('data-editor-id') || '',
          type: 'style',
          modifications: { [property]: newValue }
        });
      };
  
      // --- Image inputs ---
      if (tag === 'img') {
        // Image source
        const imgSrcInput = doc.querySelector('input[placeholder="Image URL"]');
        if (imgSrcInput) {
          imgSrcInput.oninput = () => {
            const newSrc = imgSrcInput.value;
            const origSrc = element.getAttribute('src') || '';
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.src = newSrc;
            recordMod('src', origSrc, newSrc);
          };
        }
        // Alt text
        const imgAltInput = doc.querySelector('input[placeholder="Alt Text"]');
        if (imgAltInput) {
          imgAltInput.oninput = () => {
            const newAlt = imgAltInput.value;
            const origAlt = element.getAttribute('alt') || '';
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.alt = newAlt;
            recordMod('alt', origAlt, newAlt);
          };
        }
      }
  
      // --- Link inputs ---
      if (tag === 'a') {
        // Link text
        const linkTextInput = doc.querySelector('input[placeholder="Link Text"]');
        if (linkTextInput) {
          linkTextInput.oninput = () => {
            const newText = linkTextInput.value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.innerText = newText;
            recordMod('text', element.innerText || '', newText);
          };
        }
        // URL
        const linkUrlInput = doc.querySelector('input[type="url"]');
        if (linkUrlInput) {
          linkUrlInput.oninput = () => {
            const newUrl = linkUrlInput.value;
            const origUrl = element.getAttribute('href') || '';
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.href = newUrl;
            recordMod('href', origUrl, newUrl);
          };
        }
        // Target
        const linkTargetSelect = doc.querySelector('select');
        if (linkTargetSelect) {
          linkTargetSelect.onchange = () => {
            const newTarget = linkTargetSelect.value;
            const origTarget = element.getAttribute('target') || '';
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.target = newTarget;
            recordMod('target', origTarget, newTarget);
          };
        }
      }
  
      // --- Text element inputs ---
      if (tag === 'span' || tag === 'div' || tag === 'p' || tag === 'h1' || tag === 'h2' || tag === 'h3' || tag === 'h4') {
        // Text content (textarea)
        const textTextarea = doc.querySelector('textarea');
        if (textTextarea) {
          textTextarea.oninput = () => {
            const newText = textTextarea.value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.innerText = newText;
            recordMod('text', element.innerText || '', newText);
          };
        }
        // Font family
        const fontFamilyInput = doc.querySelector('input[placeholder="e.g. Inter, serif"]');
        if (fontFamilyInput) {
          fontFamilyInput.oninput = () => {
            const newFamily = fontFamilyInput.value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.style.fontFamily = newFamily;
            recordMod('fontFamily', computed.fontFamily || '', newFamily);
          };
        }
        // Font size
        const fontSizeInput = doc.querySelector('input[placeholder="e.g. 1rem"]');
        if (fontSizeInput) {
          fontSizeInput.oninput = () => {
            const newSize = fontSizeInput.value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.style.fontSize = newSize;
            recordMod('fontSize', computed.fontSize || '', newSize);
          };
        }
        // Font weight
        // Actually, let me find the font weight select properly
        const fontWeightSelect = doc.querySelector('select'); // The first/select in the inspector for text
        if (fontWeightSelect && fontWeightSelect.options.length > 0) {
          // The font weight is the third select: Normal (400), Bold (700), Black (900)
          // Let me be more specific: it's the select after font size and color
          // Actually, let me just attach onchange to the select and determine which one
          fontWeightSelect.onchange = () => {
            const newWeight = fontWeightSelect.value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.style.fontWeight = newWeight;
            recordMod('fontWeight', computed.fontWeight || '', newWeight);
          };
        }
        // Text color
        const colorInput = doc.querySelector('input[type="color"]');
        if (colorInput) {
          colorInput.oninput = () => {
            const newColor = colorInput.value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.style.color = newColor;
            recordMod('color', computed.color || '', newColor);
          };
        }
        // Text alignment
        const alignmentSelect = doc.querySelector('select'); // The last select for alignment
        // There are multiple selects; the alignment is the last one (right after color)
        // Let me detect it by position: after we've handled font family, size, weight, color
        // Actually, simpler: attach to all selects but track which one was changed
        // For now, let me just handle the alignment select specifically
        const alignmentSelects = doc.querySelectorAll('select');
        if (alignmentSelects.length >= 4) {
          // The 4th select (index 3) is text alignment
          alignmentSelects[3].onchange = () => {
            const newAlign = alignmentSelects[3].value;
            const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
            if (el) el.style.textAlign = newAlign;
            recordMod('textAlign', computed.textAlign || '', newAlign);
          };
        }
      }
  
      // --- Container/section inputs ---
      // Background color
      const bgColorInput = doc.querySelector('input[type="color"]');
      if (bgColorInput) {
        bgColorInput.oninput = () => {
          const newBgColor = bgColorInput.value;
          const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
          if (el) el.style.backgroundColor = newBgColor;
          recordMod('backgroundColor', computed.backgroundColor || '', newBgColor);
        };
      }
      // Padding
      const paddingInput = doc.querySelector('input[placeholder="e.g. 1rem 2rem"]');
      if (paddingInput) {
        paddingInput.oninput = () => {
          const newPadding = paddingInput.value;
          const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
          if (el) el.style.padding = newPadding;
          recordMod('padding', computed.padding || '', newPadding);
        };
      }
      // Margin
      const marginInput = doc.querySelector('input[placeholder="e.g. 1rem"]');
      if (marginInput) {
        marginInput.oninput = () => {
          const newMargin = marginInput.value;
          const el = doc.querySelector(`[data-editor-id="${EditorState.state.selectedElement.getAttribute('data-editor-id') || ''}"]`);
          if (el) el.style.margin = newMargin;
          recordMod('margin', computed.margin || '', newMargin);
        };
      }
    }
    
    // ==================== CLICK OUTSIDE TO CLOSE ====================
      document.addEventListener('click', (e) => {
        // Close inspector if clicking outside the selected element
        if (selectedElement && !selectedElement.contains(e.target) && e.target !== editModeBtn) {
          resetElementSelection(iframe);
        }
      });
      
      // Close inspector when clicking outside the iframe area too
      document.addEventListener('click', (e) => {
        if (isEditMode && e.target !== iframe && !e.target.closest('#inspector')) {
          resetElementSelection(iframe);
        }
      });
    </script>

    <script>
      // Toggle section inspector visibility
      window.toggleSectionInspector = function() {
        const inspector = document.querySelector('.section-inspector-panel');
        if (inspector.style.display === 'none') {
          inspector.style.display = 'block';

    <!-- Save / Publish System -->
    <script>
      // Dirty state tracking
      let hasUnsavedChanges = false;
      let saveTimeout = null;
      
      // Record that changes have been made
      function recordUnsavedChange() {
        hasUnsavedChanges = true;
        // Update UI if needed
        const saveBtn = document.querySelector('button[style*="var(--accent)"]');
        if (saveBtn) {
          saveBtn.title = hasUnsavedChanges ? 'Unsaved changes' : 'Save';
        }
      }
      
      // Debounced auto-save
      function saveDebounced() {
        // Clear any pending timeout
        if (saveTimeout) {
          clearTimeout(saveTimeout);
        }
        // Save after 300ms of no changes
        saveTimeout = setTimeout(() => {
          savePage();
        }, 300);
      }
      
      // Save current page state
      function savePage() {
        if (!window.EditorState) return;
        
        // Record the modification in the existing history system
        const element = EditorState.state.selectedElement;
        if (element) {
          const elementId = element.getAttribute('data-editor-id') || '';
          const originalText = element.innerText;
          
          // Record the modification
          EditorState.recordModification({
            property: 'content',
            original: originalText,
            newValue: originalText,
            elementId: elementId
          });
          EditorState.saveDraftChange({
            elementId: elementId,
            type: 'content',
            modifications: { content: originalText }
          });
        }
        
        // Clear unsaved changes flag
        hasUnsavedChanges = false;
        
        // Fire event for UI update
        document.dispatchEvent(
          new CustomEvent('pe-page-saved', {
            bubbles: false
          })
        );
      }
      
      // Publish the current page
      function publishPage() {
        if (!window.pageManager) return;
        
        // Set page to published status
        window.pageManager.setPageStatus('published');
        
        // Clear unsaved changes flag
        hasUnsavedChanges = false;
        
        // Fire event
        document.dispatchEvent(
          new CustomEvent('pe-page-published', {
            bubbles: false
          })
        );
      }
      
      // Check for unsaved changes before navigating away
      window.addEventListener('beforeunload', (e) => {
        if (hasUnsavedChanges) {
          e.preventDefault();
          e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
        }
      });
      
      // Initialize from existing state
      (function() {
        const savedState = window.EditorState ? window.EditorState.state : null;
        if (savedState && savedState.revision > 0) {
          hasUnsavedChanges = false;
        }
      })();
      
      // Initialize section list on load
      if (window.UISystem && window.UISystem.SectionList) {
        window.UISystem.SectionList.init();
      }
    </script>

        if (window.extendEditorState) {

        if (window.assets && window.assets.init) {

        // Phase 4.1: Page Manager initialization (loads existing pages)
        if (window.pageManager && window.pageManager.init) {

        // Phase 4.2: Section Builder initialization (loads existing sections)
        if (window.sectionBuilder && window.sectionBuilder.init) {
          window.sectionBuilder.init();

        // Phase 4.3: UI System initialization
        if (window.UISystem && window.UISystem.SectionList) {
          window.UISystem.SectionList.init();
        }

        // Phase 4.4: Style Engine initialization
        if (window.styleEngine) {

        }
      });
